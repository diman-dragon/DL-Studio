plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Версия — единственный источник: version.txt (в CI то же самое). Поднимается при каждом изменении.
def appVersion = file('../version.txt').text.trim()
def (verMajor, verMinor, verPatch) = appVersion.tokenize('.').collect { it as int }
def semCode = verMajor * 10000 + verMinor * 100 + verPatch
def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "0") as int

base { archivesName = "DL-Studio-${appVersion}" }

android {
    namespace "com.dlstudio.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.dlstudio.app"
        minSdk 24
        targetSdk 34
        versionCode semCode * 1000 + (runNumber % 1000)
        versionName appVersion
    }

    // Постоянный ключ: каждая сборка ставится поверх предыдущей без удаления приложения
    signingConfigs {
        debug {
            storeFile file('dlstudio-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions { kotlinCompilerExtensionVersion '1.5.8' }   // под Kotlin 1.9.22
    packaging { resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' } }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'

    testImplementation 'junit:junit:4.13.2'
}
