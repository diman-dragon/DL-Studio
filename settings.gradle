// Зеркало Maven Central от Google стоит раньше самого Maven Central: у repo.maven.apache.org бывают ответы 429
// (слишком частые запросы с адресов CI), а зеркало их не ограничивает. Если артефакта в зеркале нет, Gradle идёт дальше по списку.
pluginManagement {
    repositories {
        google()
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
    }
}

rootProject.name = "DL-Studio"
include ':app'
