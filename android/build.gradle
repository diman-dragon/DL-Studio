// Корневой скрипт: только версии плагинов. Репозитории задаёт settings.gradle
// (при FAIL_ON_PROJECT_REPOS блок allprojects { repositories } ломал сборку).
plugins {
    id 'com.android.application' version '8.2.1' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
    id 'com.google.dagger.hilt.android' version '2.51' apply false
}

// minSdk / compileSdk / targetSdk для всех модулей (читаются как rootProject.ext.*)
apply from: 'variables.gradle'

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
