plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'com.google.dagger.hilt.android'
}

// Версия — единственный источник: package.json (CHANGELOG и build.gradle меняются вместе с ним).
def appVersion = new groovy.json.JsonSlurper().parse(file('../../package.json')).version
def (verMajor, verMinor, verPatch) = appVersion.tokenize('.').collect { it as int }
def semCode = verMajor * 10000 + verMinor * 100 + verPatch
def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "0") as int

base { archivesName = "LingvaDesk-${appVersion}" }

android {
    // namespace — пакет кода; applicationId НЕ МЕНЯТЬ: иначе APK не встанет поверх установленной версии
    // и данные (БД lingocards-clean.db) не сохранятся. См. docs/UPDATES.md.
    namespace "com.lingvadesk.app"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.example.lingocards"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode semCode * 1000 + runNumber
        versionName appVersion
    }

    signingConfigs {
        debug {
            storeFile file('lingvadesk-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (System.getenv("KEYSTORE_PATH")) {
                storeFile file(System.getenv("KEYSTORE_PATH"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig System.getenv("KEYSTORE_PATH") ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'   // соответствует Kotlin 1.9.22
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

kapt {
    correctErrorTypes true
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'

    // Compose BOM
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    // Hilt
    implementation 'com.google.dagger:hilt-android:2.51'
    kapt 'com.google.dagger:hilt-compiler:2.51'
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'

    // Тесты
    testImplementation 'junit:junit:4.13.2'
}
