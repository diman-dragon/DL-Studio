name: build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: gradle/actions/setup-gradle@v3
      - name: Структура (атомарность, версия)
        run: node scripts/check.mjs
      - name: Тесты, lint и сборка
        run: chmod +x gradlew && ./gradlew testDebugUnitTest connectedDebugAndroidTest lint assembleRelease
      - name: Версия
        id: ver
        run: echo "v=$(cat version.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: DL-Studio-${{ steps.ver.outputs.v }}-release
          path: app/build/outputs/apk/release/*.apk
