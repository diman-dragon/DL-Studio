name: build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: gradle/actions/setup-gradle@v3
      - name: Структура (атомарность, версия)
        run: node scripts/check.mjs
      - name: Тесты, lint и сборка
        run: chmod +x gradlew && ./gradlew testDebugUnitTest lint assembleRelease
      - name: Версия
        id: ver
        run: echo "v=$(cat version.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: DL-Studio-${{ steps.ver.outputs.v }}-release
          path: app/build/outputs/apk/release/*.apk

  # Инструментальные тесты нужен эмулятор: на голом runner устройства нет («No connected devices!»).
  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
      - name: Включить KVM для эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          script: chmod +x gradlew && ./gradlew connectedDebugAndroidTest
