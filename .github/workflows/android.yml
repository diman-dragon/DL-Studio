name: Android build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # нужно только для публикации релиза по тегу

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: ver
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Gradle 8.2.1 ставится в CI, поэтому gradle-wrapper.jar в репозитории не нужен
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2.1

      - name: Unit tests
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon

      # Версия — из package.json, подпись — постоянный ключ из репозитория:
      # каждый APK устанавливается поверх предыдущего без удаления приложения.
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: LingvaDesk-${{ steps.ver.outputs.v }}-debug
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        run: gradle assembleRelease --no-daemon
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_BASE64 != '' && format('{0}/release.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
