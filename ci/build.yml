name: build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: gradle/actions/setup-gradle@v3
      - name: Структура (атомарность, версия)
        run: node scripts/check.mjs
      - name: Тесты, lint и сборка
        run: chmod +x gradlew && ./gradlew testDebugUnitTest lint assembleRelease
      - name: Версия
        id: ver
        run: echo "v=$(cat version.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: DL-Studio-${{ steps.ver.outputs.v }}-release
          path: app/build/outputs/apk/release/*.apk
      - name: Отчёты при ошибке
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports
            app/build/test-results
